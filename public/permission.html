<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Microphone Activation</title>
  <style>
    body {
      background: #1a1a1a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #2a2a2a;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      max-width: 400px;
    }
    button {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #1d4ed8;
    }
    .error-text {
      color: #ef4444;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Activate Microphone Track</h2>
    <p>We need your permission to capture speech arrays hands-free.</p>
    <button id="grant-btn">Grant Microphone Permission</button>
    <div id="error-msg" class="error-text"></div>
  </div>

  <!-- LINK THE CSP-COMPLIANT EXTERNAL SCRIPT HERE -->
  <script src="grant.js"></script>
</body>
</html>
